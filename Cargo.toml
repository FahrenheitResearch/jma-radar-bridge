[package]
name = "jma-radar-bridge"
version = "0.1.0"
edition = "2021"
description = "Pure Rust decoder and local bridge for JMA polar-coordinate radar GRIB2 files"
license = "MIT OR Apache-2.0"

[lib]
name = "jma_radar_bridge"

[[bin]]
name = "jma-radar"
path = "src/bin/jma-radar.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
time = "0.3"
tiny_http = "0.12"
ureq = "2.12"
